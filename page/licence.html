<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Showpathy</title>
<link rel="icon" href="favicon.png">
<style>
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 500; src: url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2") }
@font-face { font-family: "Barlow Semi Condensed"; font-weight: 700; src: url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2") }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2") }
:root {
  --s0: #15130e; --s1: #1e1b15; --s2: #2d2820;
  --ink: #f1ebdc; --ink2: #b3ab98; --ink3: #948c79;
  --green: #4fc46c; --on-green: #07140b; --red: #ee6a58;
  --ring: inset 0 0 0 1px rgba(241,235,220,.11), 0 1px 0 rgba(0,0,0,.5);
  --aim: inset 0 0 0 1.5px rgba(241,235,220,.42);
  --font: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --s0: #ebe6da; --s1: #f7f3ea; --s2: #e2dccd;
    --ink: #1c1a16; --ink2: #4d483d; --ink3: #635e4c;
    --green: #1f6334; --on-green: #fff; --red: #a3342a;
    --ring: inset 0 0 0 1px rgba(28,26,22,.14), 0 1px 0 rgba(255,255,255,.7);
    --aim: inset 0 0 0 1.5px rgba(28,26,22,.4);
    color-scheme: light only;
  }
}
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: var(--s0); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.3; -webkit-user-select: none; user-select: none }
main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 16px }
.card { width: 100%; max-width: 440px; background: var(--s1); border-radius: 14px; padding: 28px 24px 24px;
  box-shadow: var(--ring) }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px }
.brand img { width: 40px; height: 40px; border-radius: 9px }
.brand img[hidden] { display: none }
h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: .01em }
p { margin: 0 0 18px; color: var(--ink2) }
form { display: flex; gap: 10px; flex-wrap: wrap }
input { flex: 1 1 220px; min-width: 0; font: 500 15px var(--mono); color: var(--ink); background: var(--s2);
  border: 0; border-radius: 10px; padding: 12px 14px; box-shadow: var(--ring); outline: none;
  -webkit-user-select: text; user-select: text }
input:focus { box-shadow: var(--aim) }
input::placeholder { color: var(--ink3) }
button { flex: 0 0 auto; font: 700 16px var(--font); letter-spacing: .04em; text-transform: uppercase;
  color: var(--on-green); background: var(--green); border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer }
button:disabled { opacity: .5; cursor: default }
button:not(:disabled):active { opacity: .62 }
#msg { min-height: 1.3em; margin: 14px 0 0; color: var(--red) }
.try { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding-top: 18px;
  border-top: 1px solid rgba(128,128,128,.25) }
.try[hidden], .back[hidden] { display: none }
.try button { color: var(--ink); background: var(--s2); box-shadow: var(--ring) }
.try span { color: var(--ink2); flex: 1 1 180px }
.back { margin-top: 18px; font-size: 15px }
a { color: var(--ink2) }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="brand"><img src="logo.png" alt="" onerror="this.hidden=true"><h1>Activate Showpathy</h1></div>
    <p id="text"></p>
    <form id="form" autocomplete="off">
      <input id="key" placeholder="Licence key" spellcheck="false" autocapitalize="characters" aria-label="Licence key">
      <button id="go" type="submit">Activate</button>
    </form>
    <p id="msg" role="status"></p>
    <div id="try" class="try" hidden>
      <button id="tryGo" type="button">Try the demo</button>
      <span id="tryHint"></span>
    </div>
    <p id="back" class="back" hidden><a href="/">Back to the demo</a></p>
  </div>
</main>
<script>const $=t=>document.getElementById(t),toApp=()=>location.replace("/?"+Date.now());async function state(){let t;try{t=await fetch("/licence/state",{cache:"no-store"})}catch(t){return null}if(!t.ok)return toApp(),null;try{return await t.json()}catch(t){return null}}async function show(){const t=await state();if(!t)return;$("text").textContent=t.text||"",$("go").disabled=!!t.busy;const e="demo"===t.state;$("try").hidden=e,$("back").hidden=!e,$("tryGo").disabled=!!t.busy,$("tryHint").textContent="The first "+(t.songs||3)+" songs of your set. No key needed."}$("tryGo").addEventListener("click",(async()=>{$("tryGo").disabled=!0;let t=null;try{const e=await fetch("/licence/demo",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});t=await e.json()}catch(t){}if(t&&t.ok)return toApp();$("tryGo").disabled=!1})),$("form").addEventListener("submit",(async t=>{t.preventDefault(),$("go").disabled=!0,$("msg").textContent="";let e=null;try{const t=await fetch("/licence/activate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:$("key").value})});e=await t.json()}catch(t){}if(e&&e.ok)return toApp();$("msg").textContent=e&&e.text||"",$("go").disabled=!1})),show(),setInterval(show,3e3),$("key").focus();</script>
</body>
</html>
